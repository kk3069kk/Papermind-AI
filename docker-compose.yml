services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: papermind
      POSTGRES_PASSWORD: papermind
      POSTGRES_DB: papermind
    ports:
      - "5432:5432"
    volumes:
      - papermind_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papermind -d papermind"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  papermind_pg:
